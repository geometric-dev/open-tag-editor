name: CI

# A v* tag push runs this workflow as well as a main-branch push does, and
# the publish job at the bottom attaches its bundles to a GitHub release.
# The tag glob uses [0-9]. not bare v*: bare v* would happily accept a
# `verify-things` tag and burn a full three-platform build before the tag
# check in the publish job rejects it. The dots and digit classes make a
# typo'd tag fail at trigger time instead.
on:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # MUST be one of the paths subosito/flutter-action recognises:
          # pubspec.yaml, .fvmrc or .fvm/fvm_config.json. An unsupported
          # path is ignored *silently*, after which the action installs the
          # newest stable instead. That disagrees with a developer's local
          # formatter and turns the format gate red on untouched files.
          flutter-version-file: .fvmrc
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          dart --version

      # Required: dart format reads analysis_options.yaml to determine the
      # package language version, and cannot resolve
      # `package:flutter_lints/flutter.yaml` without a package_config.json.
      # Without this the formatter silently falls back to a default style and
      # rejects files that are correct under the project's real settings.
      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed . || {
            changed="$(dart format --output=none . 2>/dev/null \
              | sed -n 's/^Changed \(.*\)$/\1/p' | head -n 1)"
            echo "::group::formatter rejected: $changed"
            if [ -n "$changed" ]; then
              dart format --output=show "$changed" > /tmp/fmt.dart 2>/dev/null || true
              diff -u "$changed" /tmp/fmt.dart | head -n 40 || true
            fi
            echo "::endgroup::"
            exit 1
          }

  analyze:
    name: Analyze (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Read from .flutter-version so the pinned SDK has exactly one
          # home. Do NOT also set channel here: with both present,
          # subosito/flutter-action resolves the channel instead and silently
          # installs whatever the newest stable is, which produces formatter
          # output that disagrees with a developer's local run.
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --fatal-infos: the tree is lint-clean under analysis_options.yaml, so
      # a new info is as much a regression as a warning.
      - name: Analyze
        run: flutter analyze

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows additionally exercises the real-TagLib round-trip suite
        # (auto-skipped when the DLL is absent).
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Read from .flutter-version so the pinned SDK has exactly one
          # home. Do NOT also set channel here: with both present,
          # subosito/flutter-action resolves the channel instead and silently
          # installs whatever the newest stable is, which produces formatter
          # output that disagrees with a developer's local run.
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test --reporter=expanded

  build-windows:
    name: Windows release bundle
    needs: [analyze]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Read from .flutter-version so the pinned SDK has exactly one
          # home. Do NOT also set channel here: with both present,
          # subosito/flutter-action resolves the channel instead and silently
          # installs whatever the newest stable is, which produces formatter
          # output that disagrees with a developer's local run.
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release
        run: flutter build windows --release

      # The TagLib DLLs are committed under windows/ and installed by
      # windows/CMakeLists.txt; assert that stayed true.
      - name: Verify bundle structure
        shell: pwsh
        run: ./scripts/verify-release.ps1

      # TagLib is built with MSVC, so end users need the VC++ runtime. Stage
      # it from the runner's licensed toolchain payload, then re-verify with
      # the runtime now mandatory.
      - name: Stage VC++ runtime
        shell: pwsh
        run: ./scripts/bundle-crt.ps1

      - name: Verify bundle with runtime required
        shell: pwsh
        run: ./scripts/verify-release.ps1 -RequireCrt

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: open_tag_editor-windows-x64
          path: build/windows/x64/runner/Release
          retention-days: 14

  build-macos:
    name: macOS release bundle
    needs: [analyze]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Read from .flutter-version so the pinned SDK has exactly one
          # home. Do NOT also set channel here: with both present,
          # subosito/flutter-action resolves the channel instead and silently
          # installs whatever the newest stable is, which produces formatter
          # output that disagrees with a developer's local run.
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # No prebuilt binary is committed; build the C bindings from source so
      # the trust chain is source -> artifact.
      - name: Build TagLib
        run: bash scripts/build-taglib.sh

      - name: Build release
        run: flutter build macos --release

      - name: Verify bundle
        run: bash scripts/verify-release.sh

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: open_tag_editor-macos-universal
          path: build/macos/Build/Products/Release/open_tag_editor.app
          retention-days: 14

  build-linux:
    name: Linux release bundle
    needs: [analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Read from .flutter-version so the pinned SDK has exactly one
          # home. Do NOT also set channel here: with both present,
          # subosito/flutter-action resolves the channel instead and silently
          # installs whatever the newest stable is, which produces formatter
          # output that disagrees with a developer's local run.
          flutter-version-file: .fvmrc
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libicu-dev libutfcpp-dev zlib1g-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build TagLib
        run: bash scripts/build-taglib.sh

      - name: Build release
        run: flutter build linux --release

      - name: Verify bundle
        run: bash scripts/verify-release.sh

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: open_tag_editor-linux-x64
          path: build/linux/x64/release/bundle
          retention-days: 14

  release:
    name: Publish release
    # Only a tag build publishes. Everything it needs runs for every push,
    # so "a tag release means the whole suite already passed on exactly
    # this tree" is enforced by needs:, not by trust — and a push to main
    # still builds all three bundles as artifacts without ever publishing.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [format, analyze, test, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      # Everything else in the workflow can run on the default (read) token
      # scope; creating the release and uploading assets is the only write.
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Same artifact names the build jobs uploaded. One pattern download
      # instead of three steps; merge-multiple stays off, so each artifact
      # keeps its own dist/ directory.
      - uses: actions/download-artifact@v4
        with:
          pattern: open_tag_editor-*
          path: dist

      # pubspec.yaml is the single source of truth for the version. A tag
      # that disagrees with the app it claims to identify must fail here,
      # not after the assets are attached to callsign that mislabelled them.
      - name: Check tag matches the app version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pub_version="$(sed -n 's/^version: \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' pubspec.yaml)"
          if [ -z "$pub_version" ]; then
            echo "::error::pubspec.yaml has no \"version: x.y.z\" line"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME declares $tag_version; pubspec.yaml declares $pub_version"
          if [ "$tag_version" != "$pub_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pubspec.yaml version $pub_version"
            exit 1
          fi

      # The upload path for the macOS artifact was the .app itself, so the
      # downloaded directory is its Contents/ and must be renamed back to
      # open_tag_editor.app. tar preserves the bundle (and any symlinks
      # inside Contents/Frameworks); a zip of the Windows bundle is made
      # with Compress-Archive because ubuntu runners ship pwsh but no zip(1).
      - name: Package bundles
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          mv dist/open_tag_editor-macos-universal dist/open_tag_editor.app
          tar -C dist -czf "dist/open_tag_editor-${tag_version}-macos-universal.tar.gz" open_tag_editor.app
          tar -C dist -czf "dist/open_tag_editor-${tag_version}-linux-x64.tar.gz" open_tag_editor-linux-x64

      - name: Zip the Windows bundle
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path dist/open_tag_editor-windows-x64 `
            -DestinationPath "dist/open_tag_editor-$tag-windows-x64.zip"

      # The notes are the changelog's section for this version — the same
      # text a reader gets from the repo. A missing section is not an empty
      # release body; it means the maintainer forgot to write one, so fail.
      - name: Extract release notes from the changelog
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          awk -v ver="$tag_version" '
            BEGIN { rx = "^## \\\[" ver "\\\]" }
            index($0, "## [") == 1 { keep = ($0 ~ rx); next }
            keep { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$tag_version]' section"
            exit 1
          fi
          {
            echo "### Bundles"
            echo "- \`open_tag_editor-${tag_version}-windows-x64.zip\` — Windows x64. TagLib is built with MSVC, so end users need the VC++ runtime; the needed DLLs are included in the bundle."
            echo "- \`open_tag_editor-${tag_version}-macos-universal.tar.gz\` — universal (Apple Silicon + Intel); unpack to get \`open_tag_editor.app\`."
            echo "- \`open_tag_editor-${tag_version}-linux-x64.tar.gz\` — Linux x64, built with the GTK 3 pipeline."
          } >> notes.md

      # gh release create errors when the release already exists. That is
      # the deliberate outcome for a re-pushed tag: re-publishing a version
      # must rerun the whole suite, not silently patch assets onto an old
      # build's page.
      - name: Create release with bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=()
          for f in dist/open_tag_editor-*.zip dist/open_tag_editor-*.tar.gz; do
            [ -e "$f" ] && assets+=("$f")
          done
          if [ "${#assets[@]}" -ne 3 ]; then
            echo "::error::expected 3 asset archives, found ${#assets[@]}"
            ls -la dist
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            "${assets[@]}"

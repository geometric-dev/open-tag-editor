name: open_tag_editor
description: An open-source music tag editor and file renamer. A modern alternative to Tag&Rename.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.0
  riverpod_annotation: ^4.0.0
  file_picker: ^11.0.0
  path: ^1.9.0
  collection: ^1.18.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  logging: ^1.2.0
  http: ^1.2.1
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.3
  ffi: ^2.1.2
  desktop_drop: ^0.7.0
  image: ^4.3.0
  uuid: ^4.4.0
  window_manager: ^0.5.0
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  freezed: ^3.2.0
  json_serializable: ^6.7.1
  riverpod_generator: ^4.0.0
  mockito: ^5.4.4
  ffigen: ^20.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

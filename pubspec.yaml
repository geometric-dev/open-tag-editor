name: open_tag_editor
description: An open-source music tag editor and file renamer. A modern alternative to Tag&Rename.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.0
  file_picker: ^11.0.0
  path: ^1.9.0
  equatable: ^2.0.5
  http: ^1.2.1
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.3
  ffi: ^2.1.2
  desktop_drop: ^0.7.0
  image: ^4.3.0
  uuid: ^4.4.0
  window_manager: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^20.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

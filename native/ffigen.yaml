name: TagLibBindings
description: FFI bindings for TagLib C API
output: '../lib/shared/services/taglib/taglib_bindings.g.dart'
headers:
  entry-points:
    - 'taglib_c.h'
preamble: |
  // Generated by ffigen. Do not edit.
  // ignore_for_file: type=lint
compiler-opts:
  - '-DTAGLIB_STATIC'
functions:
  include:
    - 'taglib_.*'
structs:
  include:
    - 'TagLib_.*'
enums:
  include:
    - 'TagLib_.*'
typedefs:
  include:
    - 'BOOL'
